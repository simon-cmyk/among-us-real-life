<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Among Us</title>
        <link
            rel="stylesheet"
            href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
        />
        <link rel="stylesheet" href="../../src/public/styles.css" />
    </head>
    <body>
        <div class="container-fluid h-100">
            <div id="connection-error" class="alert alert-danger" style="display: none; position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 9999;">
                Cannot connect to backend. Check console for details.
            </div>
            <h1 class="text-center my-4">Among Us</h1>
            <div class="row justify-content-center my-4">
                <div class="col-auto">
                    <button id="enable-sound" class="btn btn-primary">Enable Sound</button>
                </div>
                <div class="col-auto">
                    <button id="report-button" class="btn btn-danger">
                        <img src="../../src/public/images/report.png" alt="Report" />
                    </button>
                </div>
                <div class="col-auto">
                    <button id="emergency-button" class="btn btn-warning">
                        <img src="../../src/public/images/emergency-meeting.jpg" alt="Emergency Meeting" />
                    </button>
                </div>
            </div>
            <div id="progress-container" class="text-center my-4">
                <p id="progress-text">Progress is 0% complete</p>
            </div>
            <div id="tasks-container">
                <h2>Tasks</h2>
                <ul id="tasks-list" class="list-group"></ul>
            </div>
        </div>
        <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
        <script src="../../src/public/config.js?v=4"></script>
        <script src="../../src/public/game.js?v=4"></script>
    </body>
</html>
