<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Among Us - Real Life</title>
        <link
            rel="stylesheet"
            href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
        />
        <link rel="stylesheet" href="../public/styles.css?v=6" />
    </head>
    <body>
        <div class="container-fluid h-100">
            <div id="connection-error" class="alert alert-danger" style="display: none; position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 9999;">
                Cannot connect to backend. Check console for details.
            </div>

            <!-- Action Notification Modal -->
            <div id="action-notification" class="alert alert-info" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10000; padding: 2rem; border-radius: 1rem; background: rgba(0, 150, 200, 0.95); color: white; font-size: 1.5rem; font-weight: bold; text-align: center; min-width: 300px; box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);">
                <!-- Notification message goes here -->
            </div>

            <!-- Logo -->
            <div class="logo-container">
                <img src="../public/images/among_us_christmas.png" alt="Among Us Christmas Logo" />
            </div>

            <h1 class="text-center">🎄 Among Us Klæbuveien 🎄</h1>
            
            <div class="row justify-content-center my-4">
                <div class="col-auto">
                    <button id="enable-sound" class="btn btn-primary">🔊 Enable Sound</button>
                </div>
            </div>

            <div class="row justify-content-center my-3" style="gap: 1rem;">
                <div class="col-auto">
                    <button id="report-button" class="btn btn-danger" title="Report Body">
                        <img src="../public/images/report.png" alt="Report" />
                    </button>
                </div>
                <div class="col-auto">
                    <button id="emergency-button" class="btn btn-warning" title="Emergency Meeting">
                        <img src="../public/images/emergency-meeting.jpg" alt="Emergency Meeting" />
                    </button>
                </div>
            </div>

            <div id="progress-container">
                <p id="progress-text">🎅 Progress: 0% complete</p>
                <div class="progress">
                    <div class="progress-bar" role="progressbar" style="width: 0%" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                </div>
            </div>

            <div id="tasks-container">
                <h2 style="color: black;">📝 Tasks</h2>
                <ul id="tasks-list" class="list-group"></ul>
            </div>
        </div>
        <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
        <script src="../public/config.js?v=6"></script>
        <script src="../public/game.js?v=6"></script>
        <link rel="icon" type="image/png" href="/src/public/images/among_us_christmas.png">
    </body>
</html>
